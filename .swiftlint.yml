included:
  - mcp-inator
  - mcp-inatorTests

excluded:
  - mcp-inator.xcodeproj

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_string_enum_value
  - sorted_first_last
  - toggle_bool
  - yoda_condition

disabled_rules:
  - trailing_whitespace   # Xcode auto-trims; noisy in diffs
  - todo                  # TODOs tracked in specs

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 700
  error: 900

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded:
    - id
    - db
    - i
    - k
    - up   # URL path component

force_unwrapping:
  severity: warning

# Tests routinely use as! casts and try! in fixture helpers — allow them.
force_cast:
  severity: warning

force_try:
  severity: warning
