---
name: Version Check

"on":
  pull_request:
    branches:
      - main

jobs:
  version-check:
    name: Version bump required
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest release tag
        id: latest
        run: |
          TAG=$(git tag --sort=-v:refname | grep '^v[0-9]' | head -1 || true)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${TAG:-none}"

      - name: Get VERSION on main
        id: main
        run: |
          VER=$(git show "origin/${{ github.base_ref }}:VERSION" 2>/dev/null \
            | tr -d '[:space:]' || true)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "VERSION on main: ${VER:-not found}"

      - name: Check version bump
        run: |
          python3 .github/scripts/check_version.py \
            "${{ steps.latest.outputs.tag }}" \
            "$(cat VERSION | tr -d '[:space:]')" \
            "${{ steps.main.outputs.version }}"

      - name: Check release notes updated
        run: |
          BASE="${{ github.base_ref }}"
          if git diff "origin/${BASE}...HEAD" --name-only | grep -q '^VERSION$'; then
            if ! git diff "origin/${BASE}...HEAD" --name-only | grep -q '^RELEASE_NOTES\.md$'; then
              echo "ERROR: VERSION was bumped but RELEASE_NOTES.md was not updated."
              echo "Run /release-notes in Claude Code to generate them, then commit."
              exit 1
            fi
            echo "RELEASE_NOTES.md updated alongside VERSION — good."
          fi
